[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hulk"
version = "2.0.0"                      
description = "HULK: RNA-seq pipeline CLI"
readme = "README.md"
authors = [{ name = "Manuel Almeida" },{ name = "Pedro Barros" }]
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "click>=8.1"
]

[project.scripts]
hulk = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

